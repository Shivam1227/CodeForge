worker_processes auto;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;

    # Upstream pool for the API service. Only 1 entry active right now — per the
    # architecture doc, scaling to 3 instances is deferred until the Redis pub/sub
    # fanout fix (section 2.5) is built, since WebSocket connections are sticky to
    # whichever instance a client connects to. Adding entries here later is the
    # only change needed to scale — no rewrite of this file required.
    upstream api_pool {
        # server host.docker.internal:8080;
        # After containerizing adn putting nginx.conf inside /frontend:
        server judge-api-service:8080;
        # server host.docker.internal:8081;  # future: api-2
        # server host.docker.internal:8082;  # future: api-3
    }

    server {
        listen 80;

        # Plain REST traffic
        location /api/ {
            proxy_pass http://api_pool;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        }

        # WebSocket traffic — Nginx does NOT upgrade connections by default for
        # plain HTTP proxying, these two headers are what make the upgrade work.
        location /ws/ {
            proxy_pass http://api_pool;
            proxy_http_version 1.1;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection "upgrade";
            proxy_set_header Host $host;
            proxy_read_timeout 86400s; # keep long-lived WebSocket connections alive
        }

        location / {
            root /usr/share/nginx/html;
            try_files $uri /index.html;
        }
    }
}