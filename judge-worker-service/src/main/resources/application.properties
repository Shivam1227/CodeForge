spring.application.name=judge-worker-service

#spring.datasource.url=jdbc:mysql://localhost:3306/judge_db
#spring.datasource.url=jdbc:mysql://host.docker.internal:3306/judge_db
#After containerization:
spring.datasource.url=jdbc:mysql://mysql:3306/judge_db
spring.datasource.username= ${MYSQL_USER}
spring.datasource.password= ${MYSQL_PASSWORD}

# The API service owns the schema — worker must never alter tables
spring.jpa.hibernate.ddl-auto=none
spring.jpa.show-sql=true

spring.kafka.bootstrap-servers=kafka:9092
spring.kafka.consumer.group-id=judge-workers
spring.kafka.consumer.auto-offset-reset=earliest